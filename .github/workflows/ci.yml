# Everything `just check` covers, plus the two things it cannot: the ARM build
# (a break confined to BMCV_DRIVER_SOURCES is otherwise invisible until you
# flash) and a sanitizer run over the same tests.
#
# Each build job is one of the four builds in docs/architecture.md, so a
# failure names the toolchain it failed under. Two more aren't builds:
# `commits` enforces the Conventional Commits format .cz.toml relies on to
# bump VERSION and CHANGELOG.md, so a PR that would silently break the next
# release fails here instead. `release` is that bump, run for real once a
# push to main has cleared every other job - see its own comment below.
name: CI

on:
  push:
    branches: [main, ui-layer-restructure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: tests + flows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: extractions/setup-just@v2

      - name: Unit tests
        run: just configure-native && just test

      - name: Golden flows
        run: just configure-sim && just flows

      # A wild read is what the clock's divide-by-zero eventually turned into,
      # and this is the cheapest thing that would have caught it.
      - name: Tests under ASan/UBSan
        run: just test-san

  wasm:
    name: wasm + frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
          actions-cache-folder: 'emsdk-cache'

      - name: Build and check
        run: |
          export EMSDK_DIR="$EMSDK"
          just configure-wasm
          just wasm-check
          just web-check

  firmware:
    name: ARM firmware
    runs-on: ubuntu-24.04
    # The HAL is not vendored - cmake/stm32cubemx/CMakeLists.txt reads it out of
    # an STM32Cube FW package. Keep in step with toolchain.default.cmake.
    env:
      CUBE_G4_VERSION: v1.6.1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi ninja-build
      - uses: extractions/setup-just@v2

      - name: Cache STM32Cube FW
        id: cube-cache
        uses: actions/cache@v4
        with:
          path: ~/STM32CubeG4
          key: cube-g4-${{ env.CUBE_G4_VERSION }}

      # Only the two submodules the firmware actually compiles against. The rest
      # of the package is board support for ST's own eval boards, and pulling it
      # turns a 200MB fetch into a gigabyte.
      - name: Fetch STM32Cube FW
        if: steps.cube-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CUBE_G4_VERSION" \
            https://github.com/STMicroelectronics/STM32CubeG4.git ~/STM32CubeG4
          git -C ~/STM32CubeG4 submodule update --init --depth 1 \
            Drivers/STM32G4xx_HAL_Driver \
            Drivers/CMSIS/Device/ST/STM32G4xx

      - name: Build
        env:
          ARM_TOOLCHAIN_DIR: /usr
        run: |
          export STM32CUBE_FW_PATH="$HOME/STM32CubeG4"
          just build-ci 2>&1 | tee build.log

      # Printed rather than gated: the sr-table alone moved flash 16 points in
      # one commit, and a number in the log is what makes that visible while
      # there is still room to react to it.
      - name: Size
        run: |
          {
            echo '### Firmware size'
            echo '```'
            arm-none-eabi-size build-ci/BMCVFirmware.elf
            # --print-memory-usage goes to the linker's stdout, not the map.
            grep -A2 'Memory region' build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Picked up by `release` below and attached to the GitHub Release. The
      # .bin is what the updater page offers in its version dropdown and the
      # only thing that can be flashed; the .elf beside it is the same build
      # with its symbols still attached, which is what a debugger or a live
      # variable viewer needs to make sense of a module running that release.
      # Both come out of this one build, so the symbols describe the image.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            build-ci/BMCVFirmware.bin
            build-ci/BMCVFirmware.elf
          retention-days: 5

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: CLANG_FORMAT=clang-format-18 just fmt-check

  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install commitizen==4.17.0
      - name: cz check over this PR's commits
        run: |
          cz check --rev-range \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # A release is "merge to main" and nothing else. Gated on every build job
  # by `needs`, so a bump never tags code that failed its own CI run - and
  # main-only, via the `if`, so pushes to other branches never cut one.
  # `cz bump` exits 21 (NO_INCREMENT) when nothing since the last tag is
  # release-worthy; that is not a failure, so it is handled rather than
  # propagated. Pushing with the default GITHUB_TOKEN, rather than a PAT, is
  # deliberate too: GitHub does not let a GITHUB_TOKEN push re-trigger `on:
  # push`, which is what keeps the bump commit below from starting another
  # release.
  release:
    name: release
    needs: [host, wasm, firmware, format]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      # To dispatch pages.yml below - a GITHUB_TOKEN push, unlike a human's,
      # never re-triggers `on: push` itself, so nothing else would pick up
      # the new release's binary otherwise.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install commitizen==4.17.0
      - uses: extractions/setup-just@v2
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: dist

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and changelog
        id: bump
        run: |
          set +e
          just bump-ci
          code=$?
          set -e
          if [ "$code" -eq 21 ]; then
            echo "Nothing release-worthy since the last tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Push the bump commit and tag
        if: steps.bump.outputs.bumped == 'true'
        run: git push origin HEAD:main && git push origin --tags

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          # Matches the heading for the version just bumped, not whatever
          # happens to be the first "## " line in the file - CHANGELOG.md's
          # top section is a hand-narrated pre-versioning history, not cz's
          # entries, and the two only stay in the same order by convention.
          awk -v ver="v${{ steps.bump.outputs.version }}" '
            $0 ~ "^## " ver "( |$)" { print; capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file "$notes" \
            dist/BMCVFirmware.bin dist/BMCVFirmware.elf

      # Pages mirrors each release's .bin onto its own origin - see pages.yml
      # for why - so the version dropdown has this one to show.
      - name: Redeploy Pages with the new release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

      # The Rack plugin for all four platforms, added to the release once it
      # exists. Dispatched rather than a job here for the same reason it lives
      # in its own workflow - see vcv.yml's header - and dispatched at all
      # because a GITHUB_TOKEN release, like a GITHUB_TOKEN push, never
      # triggers a workflow on its own.
      - name: Build and attach the VCV Rack plugins
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run vcv.yml --repo "${{ github.repository }}" --ref main \
            -f tag="v${{ steps.bump.outputs.version }}"
