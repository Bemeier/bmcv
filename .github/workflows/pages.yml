# Deploys web/ - the simulator and web/update/, the firmware updater - to
# GitHub Pages. `just wasm` (same as the wasm+frontend job in ci.yml) is the
# only build step; the rest of web/ is plain static ES modules.
name: Deploy Pages

on:
  push:
    branches: [main, ui-layer-restructure]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys are a single moving target - let one in flight finish rather
# than racing a second push against it, but never cancel one that already
# reached deploy-pages: that would leave the site mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: BMCVFirmware

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: extractions/setup-just@v2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
          actions-cache-folder: 'emsdk-cache'

      - name: Build the wasm simulator
        run: |
          export EMSDK_DIR="$EMSDK"
          just configure-wasm
          just wasm

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: BMCVFirmware/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
