# Deploys web/ - the simulator and web/update/, the firmware updater - to
# GitHub Pages. `just wasm` (same as the wasm+frontend job in ci.yml) is the
# only build step; the rest of web/ is plain static ES modules.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploys are a single moving target - let one in flight finish rather
# than racing a second push against it, but never cancel one that already
# reached deploy-pages: that would leave the site mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: extractions/setup-just@v4
      - uses: mymindstorm/setup-emsdk@v15
        with:
          version: 'latest'
          actions-cache-folder: 'emsdk-cache'

      - name: Build the wasm simulator
        run: |
          export EMSDK_DIR="$EMSDK"
          just configure-wasm
          just wasm

      # web/firmware/ - the updater's version dropdown. See the script for why
      # this mirrors each release's .bin onto Pages rather than the updater
      # fetching it from the release directly.
      - name: Mirror release binaries for the updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-releases.sh

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
