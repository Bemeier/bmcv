<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMCV simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <section id="panel-pane">
    <div id="panel-wrap"><svg id="panel" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <p id="hint" class="hint">&nbsp;</p>
    <p class="help">
      Drag an encoder's <b>ring</b> to turn it, or use the scroll wheel.
      Click its <b>centre</b> to push. Hold <kbd>Shift</kbd> while turning for
      press-and-turn.
    </p>
  </section>

  <section id="side">
    <div id="side-grid">
    <div class="panel-box">
      <div class="scopes">
        <div class="bracket"><i></i><span>outputs</span><i></i></div>
        <canvas id="scope" width="1000" height="440"></canvas>

        <div class="bracket"><i></i><span>inputs</span><i></i></div>
        <canvas id="inscope"></canvas>

        <div id="in-controls"></div>
      </div>
    </div>

    <div class="panel-box">
      <table id="params"></table>
      <div class="readouts rates">
        <div class="readout"><span class="label">mode</span><span id="r-shift" class="value">—</span></div>
        <div class="readout"><span class="label">param</span><span id="r-param" class="value">—</span></div>
        <div class="readout"><div id="keys" class="keys"></div></div>
        <div class="readout"><span class="label">scene</span><span id="r-scene" class="value">—</span></div>
        <div class="readout"><span class="label">bpm in</span><span id="r-bpm-in" class="value">—</span></div>
        <div class="readout"><span class="label">bpm run</span><span id="r-bpm" class="value">—</span></div>
      </div>
    </div>

    <div class="panel-box" id="system">
      <div class="readouts">
        <div class="readout">
          <span class="label">source</span><span id="source-name" class="value muted">simulation</span>
        </div>
      </div>
      <p id="source-detail" class="note"></p>

      <div class="buttons">
        <button id="connect-usb" title="a module on the other end of a USB cable">Connect over USB</button>
        <button id="connect-probe" title="a module on the other end of an ST-Link, for when it is not answering">Use a debug probe</button>
        <button id="reset">Reset module</button>
        <button id="reset-fram">Clear FRAM</button>
        <span id="status" class="muted"></span>
      </div>

      <!-- Everything below belongs to one source or another. A page showing
           hardware has nothing to say about a MIDI port it is not driving, and
           a page running the simulation has no link to report on. -->

      <div class="when-live">
        <div class="readouts rates">
          <div class="readout"><span class="label" id="r-link-label">link</span><span id="r-probe-hz" class="value">—</span></div>
          <div class="readout"><span class="label">engine</span><span id="r-engine-fps" class="value">—</span></div>
          <div class="readout"><span class="label">dac</span><span id="r-dac-fps" class="value">—</span></div>
          <div class="readout"><span class="label">leds</span><span id="r-led-fps" class="value">—</span></div>
        </div>
      </div>

      <div class="when-sim" id="midi">
        <div class="readouts">
          <div class="readout">
            <span class="label">MIDI out port</span>
            <select id="midi-port"><option value="">off</option></select>
          </div>
          <div class="readout"><span class="label">status</span><span id="midi-status" class="value">—</span></div>
          <div class="readout when-midi"><span class="label">clock</span><span id="midi-clock" class="value">—</span></div>
        </div>
        <div id="midi-cc" class="when-midi"></div>
        <p class="note when-midi">Everything on MIDI channel&nbsp;1.</p>
      </div>
    </div>
    </div>
  </section>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
